# =============================================================================
# CATBOOST CLASSIFIER HYPERPARAMETER SEARCH SPACE
# =============================================================================
model_name: catboost

search_space:
  # Number of sequential boosting trees built during training
  # Higher values improve capacity but increase training time and risk of overfitting
  catboost_iterations:
    type: int
    low: 80
    high: 1000

  # Step size shrinkage applied to each tree's update
  # Lower values require more trees but lead to smoother convergence and better generalization
  catboost_learning_rate:
    type: float
    low: 0.001
    high: 0.3
    log: true

  # Depth of CatBoost's oblivious (symmetric) decision trees
  # Symmetric trees evaluate the same split across all nodes at a given depth (typically 4-10)
  catboost_depth:
    type: int
    low: 1
    high: 10

  # L2 regularization coefficient for leaf value estimation
  # Penalizes large leaf weights to mitigate overfitting on noisy observations
  catboost_l2_leaf_reg:
    type: float
    low: 0.00001
    high: 100.0
    log: true

  # Amount of random noise added to split selection scoring
  # Helps explore alternative splits and avoid greedily overfitting local noise
  catboost_random_strength:
    type: float
    low: 0.001
    high: 10.0
    log: true

  # Number of quantization bins for continuous numerical features (similar to histogram bins)
  # Higher values preserve finer feature details; lower values accelerate computation
  catboost_border_count:
    type: int
    low: 32
    high: 255


  # ---------------------------------------------------------------------------
  # Fixed Execution & Objective Parameters
  # ---------------------------------------------------------------------------
  # Multi-class loss function optimizing multiclass log-loss across GALAXY, STAR, QSO
  catboost_loss_function:
    type: fixed
    value: "MultiClass"

  # Automatically adjust class weights inversely proportional to target class frequencies
  catboost_auto_class_weights:
    type: fixed
    value: "Balanced"

  # Silence verbose training logs during Optuna trials
  catboost_verbose:
    type: fixed
    value: 0

  # Utilize all available CPU threads for parallel training
  catboost_thread_count:
    type: fixed
    value: -1