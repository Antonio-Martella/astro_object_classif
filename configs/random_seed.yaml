# =============================================================================
# RANDOM SEED CONFIGURATION FOR REPRODUCIBILITY
# =============================================================================

global_seed:
  # Master seed used for data splitting (train / test)
  random_seed_train_split: 42

  # Seed used for resampling techniques (SMOTE, RandomUnderSampler)
  random_seed_resempling: 42

  # Seed used for StratifiedGroupKFold cross-validation
  random_seed_sgkf: 42

  # Fixed random seed injected into all estimators (Scikit-Learn, LightGBM, XGBoost, etc.)
  random_seed_models: 42

  # Seed for Optuna TPESampler Bayesian optimization
  random_seed_optuna: 42