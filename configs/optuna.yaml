# =============================================================================
# OPTUNA HYPERPARAMETER OPTIMIZATION CONFIGURATION
# =============================================================================

# 1. MLflow Tracking Context
experiment:
  name_experiment: "Astro_Object_Classification"

# 2. Optuna Study & Sampler Settings (TPESampler)
study:
  study_name: "opt_astro"
  metric_to_optimize: "f1_weighted"
  direction: "maximize"
  n_trials: 500
  n_startup_trials: 300
  multivariate: True

# 3. Model Evaluation Protocol
cross_validation:
  n_folds_cv: 3

# 4. Global Search Space Definition
search_space:
  candidate_models:
    - "dense_nn"
    - "random_forest"
    - "xgboost"
    - "lightgbm"
    - "catboost"
    - "extra_trees"
    - "svc"
    - "sgd"
    - "logreg"

  resampling_strategy:
    type: "categorical"
    choices: 
      - "class_weight"
      - "smote"
      - "undersampling"

  scaler_strategy:
    type: "categorical"
    choices: 
      - "standard"
      - "robust"
      - "minmax"