[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true
disable_error_code = ["import-untyped"]
mypy_path = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
